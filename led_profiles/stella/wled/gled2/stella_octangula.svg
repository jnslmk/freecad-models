<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>Stella octangula — 276 pixels, two interpenetrating tetrahedra</title>
  <!-- Elevation map for a vertical scan: level base corners share Y. Their edges overlap here; electrical directions and corner pairings are physically calibrated, not inferred from the drawing. -->
