      <path id="T2-E4" d="M 340,128 L 200,378"><desc>{"groups":["all","tetra2","T2-E4"],"universe":2,"start":207,"count":23}</desc></path>
      <path id="T2-E5" d="M 200,378 L 200,128"><desc>{"groups":["all","tetra2","T2-E5"],"universe":2,"start":230,"count":23}</desc></path>
      <path id="T2-E6" d="M 340,128 L 60,128"><desc>{"groups":["all","tetra2","T2-E6"],"universe":2,"start":253,"count":23}</desc></path>
