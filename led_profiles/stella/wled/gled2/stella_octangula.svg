      <path id="T1-E5" d="M 200,272 L 340,272"><desc>{"groups":["all","tetra1","T1-E5"],"universe":2,"start":92,"count":23}</desc></path>
      <path id="T1-E6" d="M 200,22 L 200,272"><desc>{"groups":["all","tetra1","T1-E6"],"universe":2,"start":115,"count":23}</desc></path>
    </g>
